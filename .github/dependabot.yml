version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      # Babel packages are versioned in lockstep — group them (incl. majors)
      # so a 7->8 style bump lands as one PR, not separate conflicting ones
      babel:
        applies-to: 'version-updates'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
        patterns:
          - '@babel/*'
          - 'babel-loader'

      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      prod:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'

      other:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

    # Schedule run nightly
    schedule:
      interval: 'cron'
      cronjob: '0 0 * * *'

    cooldown:
      default-days: 3

    versioning-strategy: increase

    ignore:
      # Pinned to v3 — v4 breaks Bell/Wreck proxy support (see setup-proxy.js)
      - dependency-name: global-agent
      # Held on v6 for typescript-eslint, which needs the JS API that TS 7.0
      # dropped. The compiler runs from the typescript-7 alias instead — see
      # typescript-7-alias.test.js, which fails once the hold can be lifted.
      - dependency-name: typescript
        versions:
          - '>=7'

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run nightly
    schedule:
      interval: 'cron'
      cronjob: '0 0 * * *'

    cooldown:
      default-days: 3
